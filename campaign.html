<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>عجلة الحظ — نسخة تجريبية</title><style>
@font-face{font-family:Th;src:url(https://cdn.jsdelivr.net/gh/khatib707/thmanyah-font@main/thmanyahsans-Regular.otf);font-weight:400;font-display:swap}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Th,Arial,sans-serif}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #dbff00;outline-offset:4px}.main{position:fixed;inset:0;overflow:hidden;background:transparent}.shade{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.canvas{position:absolute;width:440px;height:956px;left:50%;top:50%;transform-origin:center;direction:rtl}.screen{position:absolute;inset:0}.screen[hidden]{display:none}.art{position:absolute;display:block;pointer-events:none;user-select:none}.title{left:99px;top:106px;width:224px;height:45px}.pointer{left:188px;top:205px;width:64.11786px;height:109.19438px}.lever{left:209.96161px;top:223px;width:19.07344px;height:54.44247px;z-index:3}.wheel{left:70px;top:247px;width:300px;height:300px;transition:transform 5.5s cubic-bezier(.12,.72,.1,1);will-change:transform}.spin{position:absolute;left:142px;top:598px;width:153px;height:37px;padding:0;border:0;border-radius:40px;background:#9475e0}.spin img{position:absolute;left:14px;top:-4px;width:126px;height:40px}.spin:disabled{cursor:default}.sponsor-label{left:175.03662px;top:659.0365px;width:72px;height:49px}.sponsors{left:44.03662px;top:717.0365px;width:334px;height:114px}.panel-art{left:42px;top:255px;width:356.34369px;height:443px;border-radius:20.247px}.coupon{position:absolute;left:65px;top:567px;width:310px;height:34px;display:flex;direction:ltr;align-items:center;justify-content:center;gap:8px;background:transparent;border:0;padding:0;color:#000;font-size:19.437px}.coupon img{width:19.437px;height:19.437px;flex:none;color:#9475e0}.coupon span{direction:ltr}.valid{position:absolute;left:110px;top:606.249px;width:220px;margin:0;text-align:center;font-size:10px;line-height:22.44px;color:#000}.shop{position:absolute;left:150.52295px;top:635.63989px;width:143.34735px;height:34.8245px;padding:0;border:0;border-radius:32.395px;background:#9475e0;color:#fff;font-size:19.437px;line-height:34.8245px}.shop img{position:absolute;left:20.24685px;top:-4.76049px;width:97.18465px;height:39.48629px}.status{position:absolute;left:60px;top:677px;width:320px;text-align:center;margin:0;color:#563393;font-size:11px;line-height:15px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(prefers-reduced-motion:reduce){.wheel{transition-duration:.01s}}
</style></head><body><main class="main" aria-label="عجلة الحظ"><img class="shade" id="shade" alt=""><div class="canvas" id="canvas"><section class="screen" id="wS" aria-label="جرّب حظّك"><img class="art title" id="title" alt="جـــــرّب حـظـــــك"><img class="art pointer" id="pointer" alt=""><img class="art wheel" id="wheel" alt="ثماني نتائج: شحن مجاني، كاش باك حتى 15%، قسيمة 500 ريال، خصم 5%، حظ أوفر، قسيمة 100 ريال، خصم 10%، كود المفاجأة"><img class="art lever" id="lever" alt=""><button class="spin" id="sp" aria-label="لفهـــــا الحيــن"><img id="spinLabel" alt="لفهـــــا الحيــن"></button><img class="art sponsor-label" id="sponsorLabel" alt="برعـايــة"><img class="art sponsors" id="sponsors" alt="LOCA، Orlema، HEARTS، L’Oréal Paris، REBUNE، globalstar، Garnier، Maybelline، Pastel"></section><section class="screen" id="rS" hidden aria-label="نتيجة العجلة"><h1 class="sr" id="resultTitle"></h1><img class="art panel-art" id="panelArt" alt=""><button class="coupon" id="copyBtn" aria-label="انسخ الكود"><img id="copyIcon" alt=""><span id="code"></span></button><p class="valid" id="valid">الكود صالح لمدة 24 ساعة</p><button class="shop" id="shopBtn" aria-label="تســوّق الآن"><img id="shopLabel" alt="تســوّق الآن"></button><p class="status" id="status" role="status" aria-live="polite"></p></section></div></main><script>
const SHOP_URL="";
const weDATA=[
 {id:"ship",n:"شحن مجاني",c:"TEST-SHIP",i:0,w:12.5,screen:0},
 {id:"cashback",n:"كاش باك حتى 15%",c:"TEST-CASHBACK",i:1,w:12.5,screen:7},
 {id:"voucher500",n:"قسيمة شرائية 500 ريال",c:"TEST-500",i:2,w:12.5,screen:6},
 {id:"d5",n:"خصم 5%",c:"TEST-5",i:3,w:12.5,screen:5},
 {id:"lose",n:"حظ أوفر",c:"",i:4,w:12.5,screen:4},
 {id:"voucher100",n:"قسيمة شرائية 100 ريال",c:"TEST-100",i:5,w:12.5,screen:3},
 {id:"d10",n:"خصم 10%",c:"TEST-10",i:6,w:12.5,screen:2},
 {id:"gift",n:"كود المفاجأة",c:"TEST-GIFT",i:7,w:12.5,screen:1}
];
const ASSET_BASE="https://raw.githubusercontent.com/khatib707/black-friday-da/main/assets/";
const ASSETS={"overlay":"overlay.png","title":"title.png","pointer":"pointer.png","lever":"lever.png","wheel":"wheel.png","spin-label":"spin-label.png","sponsor-label":"sponsor-label.png","sponsors":"sponsors.png","shop-label":"shop-label.png","copy-icon":"copy-icon.png","result0":"result0.png","result1":"result1.png","result2":"result2.png","result3":"result3.png","result4":"result4.png","result5":"result5.png","result6":"result6.png","result7":"result7.png"};
for(const key in ASSETS)ASSETS[key]=ASSET_BASE+ASSETS[key];
const $=id=>document.getElementById(id);
for(const [id,key] of Object.entries({shade:"overlay",title:"title",pointer:"pointer",lever:"lever",wheel:"wheel",spinLabel:"spin-label",sponsorLabel:"sponsor-label",sponsors:"sponsors",shopLabel:"shop-label",copyIcon:"copy-icon"}))$(id).src=ASSETS[key];
let busy=false,rot=0,selected=null,copyTimer;
function resize(){const s=Math.min(innerWidth/440,innerHeight/956);$("canvas").style.transform="translate(-50%,-50%) scale("+s+")"}
addEventListener("resize",resize);if(window.visualViewport)visualViewport.addEventListener("resize",resize);resize();
function pick(){let r=Math.random()*weDATA.reduce((a,x)=>a+x.w,0);for(const x of weDATA){r-=x.w;if(r<=0)return x}return weDATA[0]}
function show(x){selected=x;$("wS").hidden=true;$("rS").hidden=false;$("panelArt").src=ASSETS["result"+x.screen];$("panelArt").alt=x.n;$("resultTitle").textContent=x.id==="lose"?"حظ أوفر":"مبرووووك — "+x.n;$("code").textContent=x.c;$("copyBtn").hidden=!x.c;$("copyBtn").style.display=x.c?"flex":"none";$("valid").hidden=!x.c;$("status").textContent=""}
function spin(){if(busy)return;busy=true;const x=pick();$("sp").disabled=true;const target=((360-x.i*45)%360+360)%360;const current=((rot%360)+360)%360;rot+=2160+(target-current+360)%360;$("wheel").style.transform="rotate("+rot+"deg)";const reduced=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;setTimeout(()=>show(x),reduced?50:5650)}
function fallbackCopy(t){const e=document.createElement("textarea");e.value=t;e.style.cssText="position:fixed;left:0;top:0;opacity:0";e.readOnly=true;document.body.appendChild(e);e.select();e.setSelectionRange(0,t.length);let success=false;try{success=document.execCommand("copy")}finally{e.remove()}return success}
async function copyCode(){if(!selected||!selected.c)return;let success=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(selected.c);success=true}else success=fallbackCopy(selected.c)}catch(e){try{success=fallbackCopy(selected.c)}catch(ignore){}}$("status").textContent=success?"تم نسخ الكود":"تعذر النسخ — اضغط مطولاً على الكود لنسخه";clearTimeout(copyTimer);copyTimer=setTimeout(()=>$("status").textContent="",2200)}
$("sp").addEventListener("click",spin);$("copyBtn").addEventListener("click",copyCode);$("shopBtn").addEventListener("click",()=>{if(SHOP_URL)location.assign(SHOP_URL);else $("status").textContent="رابط التسوق غير مضاف في النسخة التجريبية"});
const preview=new URLSearchParams(location.hash.slice(1)).get("preview");if(preview){const x=weDATA.find(x=>x.id===preview);if(x)show(x)}
</script></body></html>
